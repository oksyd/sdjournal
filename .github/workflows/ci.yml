name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.100.0"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.100.0)
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            fuzz/target
          key: cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'fuzz/Cargo.toml', 'fuzz/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install CI tools
        run: |
          if ! command -v just >/dev/null; then
            cargo install just --locked
          fi
          if ! command -v cargo-nextest >/dev/null; then
            cargo install cargo-nextest --locked
          fi
          if ! command -v cargo-audit >/dev/null; then
            cargo install cargo-audit --locked
          fi

      - name: Print systemd version
        run: systemd --version

      - name: Run just ci
        run: just --justfile .justfile ci

      - name: Audit dependencies
        run: just --justfile .justfile audit

  features:
    name: features
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.100.0)
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            fuzz/target
          key: cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'fuzz/Cargo.toml', 'fuzz/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Check and test each optional feature in isolation
        run: |
          for feature in mmap lz4 zstd xz tracing tokio verify-seal; do
            cargo clippy --locked --no-default-features --features "$feature" --all-targets -- -D warnings
            cargo test --locked --no-default-features --features "$feature" --lib \
              --test offline_journal --test journal_snapshot \
              --test parser_regressions --test live_shared_engine --test seal_verification
            cargo test --locked --no-default-features --features "$feature" --doc
          done

      - name: cargo clippy (fuzz harnesses)
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  offline-macos:
    name: offline (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.100.0)
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/ci.yml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: cargo check (all features)
        run: cargo check --locked --all-features --all-targets

      - name: cargo test (offline)
        run: >-
          cargo test --locked --all-features --lib --test offline_journal
          --test journal_snapshot --test parser_regressions --test seal_verification

  golden:
    name: golden (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    env:
      SDJOURNAL_TEST_USE_SUDO: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.100.0)
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            fuzz/target
          key: cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'fuzz/Cargo.toml', 'fuzz/Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Print systemd version
        run: systemd --version

      - name: cargo test (journalctl integration)
        run: |
          cargo test --locked --all-features --test golden_journalctl -- --ignored
